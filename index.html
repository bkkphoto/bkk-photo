
<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-NZXGSWB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <!-- End Google Tag Manager -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BKK.photo | Photography</title>

  <meta name="description" content="BKK.photo — Photography. People. Places. Based in Bangkok, Thailand, working worldwide.">

  <meta name="theme-color" content="#080711">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #080711;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .welcome {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 500px;
      overflow: hidden;
      background: #080711;
      color: #f5f4f2;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .branding {
      position: absolute;
      top: 11%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      z-index: 2;
    }

    .logo {
      font-size: 17px;
      font-weight: 300;
      letter-spacing: 0.18em;
      line-height: 1.4;
    }

    .tagline {
      margin-top: 13px;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.19em;
      line-height: 1.6;
      opacity: 0.85;
    }

    .instagram {
      position: absolute;
      right: 38px;
      bottom: 30px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #f5f4f2;
      text-decoration: none;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.16em;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .instagram svg {
      flex-shrink: 0;
    }

    .instagram:hover {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .branding {
        top: 10%;
      }

      .logo {
        font-size: 15px;
      }

      .tagline {
        font-size: 9px;
        margin-top: 10px;
        letter-spacing: 0.15em;
      }

      .instagram {
        right: 20px;
        bottom: 22px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .instagram {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="welcome">

    <img
      class="hero-image"
      src="bkk-hero.jpg"
      alt="A vibrant illuminated installation and crowd at a Bangkok event"
    >

    <header class="branding">
      <h1 class="logo">BKK.photo</h1>
      <p class="tagline">Photography. People. Places.</p>
    </header>

    <a
      class="instagram"
      href="https://www.instagram.com/bangkokphotographer/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit BKK.photo on Instagram"
    >
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/>
      </svg>
      INSTAGRAM ↗
    </a>

  </main>

</body>
</html>
