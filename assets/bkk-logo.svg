<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">BKK.photo</title>
<desc id="desc">Large custom pixel BKK lettering above PHOTO, with a separate square dot offset to the left.</desc>
<style>
.pixel{fill:#074eff;animation:bkk-colour-cycle 10s ease-in-out infinite}
@keyframes bkk-colour-cycle{0%,100%{fill:#074eff}18%{fill:#4930d6}36%{fill:#7836c8}52%{fill:#b044bd}62%{fill:#e0ae50}76%{fill:#7836c8}}
@media(prefers-reduced-motion:reduce){.pixel{animation:none;fill:#074eff}}
</style>
<g class="pixel">
<!-- BKK wordmark: deliberately broad, custom stepped letterforms -->
<path d="M150 20H430V70H480V180H430V220H480V330H430V380H150Z M240 90H340V160H240Z M240 240H340V310H240Z"/>
